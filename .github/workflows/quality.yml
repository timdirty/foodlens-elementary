name: FoodLens quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodlens-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Static and unit checks
        run: npm run verify

      - name: Package and smoke-test offline competition bundle
        run: npm run package:offline:from-build

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Production browser journeys
        run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Run pgTAP database and RLS tests
        run: supabase test db

      - name: Lint application schemas
        run: supabase db lint --local --schema public,private
